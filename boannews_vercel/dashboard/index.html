<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국내/해외 뉴스 클리핑</title>
<meta name="description" content="일간/주간 보안 뉴스 동향 — 국내/해외">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="page">

  <header class="topbar">
    <div class="brand">
      <button type="button" class="insight-toggle" id="insight-toggle" aria-label="인사이트 열기">≡<span class="insight-badge" id="insight-badge" hidden>0</span></button>
      <span class="brand-name">국내/해외 뉴스 클리핑</span>
    </div>
    <div class="topbar-controls">
      <input type="search" id="search-input" class="search-input" placeholder="검색 (제목·요약·카테고리)" aria-label="히스토리 검색">
      <div class="segmented" id="period-switch" role="tablist" aria-label="기간 선택">
        <button type="button" class="segmented-btn is-active" data-period="daily" role="tab" aria-selected="true">일간</button>
        <button type="button" class="segmented-btn" data-period="weekly" role="tab" aria-selected="false">주간</button>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="테마 전환" title="테마 전환">테마</button>
    </div>
  </header>

  <main id="app" class="content">
    <div class="loading" id="loading">불러오는 중…</div>
  </main>

  <footer class="footer">
    <span id="generated-at"></span>
  </footer>
</div>

<aside id="right-sidebar" class="right-sidebar">
  <div id="trending-sidebar" class="sidebar-panel trending-panel"></div>
  <div id="keyword-sidebar" class="sidebar-panel"></div>
  <div id="trend-sidebar" class="sidebar-panel"></div>
</aside>

<aside id="insight-drawer" class="insight-drawer">
  <div class="insight-drawer-head">
    <span>인사이트 <span class="count" id="insight-drawer-count"></span></span>
    <button type="button" id="insight-drawer-close" class="insight-drawer-close" aria-label="닫기">✕</button>
  </div>
  <div id="insight-drawer-body" class="insight-drawer-body"></div>
</aside>

<div id="insight-detail" class="insight-detail">
  <div class="insight-detail-head">
    <button type="button" id="insight-detail-back" class="insight-detail-back" aria-label="목록으로">← 목록</button>
    <div class="insight-detail-head-right">
      <button type="button" id="insight-detail-reanalyze" class="insight-detail-reanalyze">재분석</button>
      <button type="button" id="insight-detail-close" class="insight-detail-close" aria-label="닫기">✕</button>
    </div>
  </div>
  <div id="insight-detail-body" class="insight-detail-body"></div>
</div>

<template id="tpl-error">
  <div class="empty-state">
    <p>데이터를 불러오지 못했습니다.</p>
    <p class="empty-state-detail"></p>
  </div>
</template>

<script src="assets/app.js"></script>
</body>
</html>
